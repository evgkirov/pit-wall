name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.15"
          enable-cache: true
      - run: make lint
      - run: make typecheck
      - run: make test
