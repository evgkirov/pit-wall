[project]
name = "pitwall"
version = "0.1.0"
description = "Modular Twitch chat reader"
readme = "README.md"
authors = [
    { name = "Evgeniy Kirov", email = "code@evgkirov.com" }
]
requires-python = ">=3.15"
dependencies = [
    "twitchio>=3.3.2",
    "watchfiles>=1.3.0",
]

[project.scripts]
pitwall = "pitwall:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
